# BenitoSticker: compila l'APK e, se i segreti di firma ci sono, pubblica una release
# (Obtainium legge le release di questa repo).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: 2.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.x'
          cache: true

      - name: Configura firma
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi codice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compila APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name "$VERSION_NAME" --build-number "$((1000 + VERSION_CODE))"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "out/BenitoSticker-${VERSION_NAME}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BenitoSticker-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Pubblica release
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: BenitoSticker ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
