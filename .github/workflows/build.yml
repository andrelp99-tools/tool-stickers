# BenitoSticker: compila l'APK e, se i segreti di firma ci sono, pubblica una release
# (Obtainium legge le release di questa repo).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: 2.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.x'
          cache: true

      - name: Configura firma
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Dipendenze
        run: |
          flutter pub get
          flutter gen-l10n

      # Errori e avvisi diventano "annotazioni" leggibili anche dalla pagina della run.
      - name: Analisi codice
        run: |
          dart analyze --format=machine lib > analyze.txt 2>&1 || true
          awk -F'|' '$1=="ERROR"{n++; if(n<=40) printf "::error file=%s,line=%s,col=%s::%s (%s)\n",$4,$5,$6,$8,$3}
                     $1=="WARNING"{m++; if(m<=10) printf "::warning file=%s,line=%s::%s (%s)\n",$4,$5,$8,$3}
                     END{print "Errori: " n+0 ", avvisi: " m+0}' analyze.txt
          if grep -q '^ERROR|' analyze.txt; then exit 1; fi

      - name: Compila APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name "$VERSION_NAME" --build-number "$((1000 + VERSION_CODE))" 2>&1 | tee build.log
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "out/BenitoSticker-${VERSION_NAME}-arm64-v8a.apk"

      - name: Errori di compilazione
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -nE "error:|Error:|FAILURE|What went wrong|e: " build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: BenitoSticker-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Pubblica release
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: BenitoSticker ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
